<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oussama Chkir</title>
  <meta name="description" content="Apps by Oussama Chkir, including Athletx, a fitness and workout tracking app.">
  <style>
    :root { --bg: #ffffff; --fg: #111111; --muted: #555555; --accent: #0a66ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e10; --fg: #f2f2f2; --muted: #a0a0a8; --accent: #6ea2ff; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 32rem; padding: 2rem 1.25rem; text-align: center; }
    h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
    p { margin: 0 0 1.25rem; color: var(--muted); }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Oussama Chkir</h1>
    <p>Developer of Athletx, a fitness app for live workouts and custom training plans.</p>
    <a href="https://oussamachkir.github.io/athletx-website/">Visit the Athletx website</a>
  </main>
</body>
</html>
